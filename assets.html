<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에셋 | 구원해주소서</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">구원해주소서</a><nav><a href="index.html">작품으로 돌아가기</a></nav></header><main class="asset-main"><div class="inner"><div class="eyebrow">ASSET ARCHIVE</div><h1 style="font-size:clamp(38px,5vw,65px)">에셋</h1><p class="muted">구원해주소서의 이미지 모음</p><div id="gallery" class="gallery"></div><div id="empty" class="empty">이미지를 준비하고 있습니다.</div></div></main><script src="assets-data.js"></script><script>const gallery=document.querySelector('#gallery');for(const item of window.ASSETS||[]){const figure=document.createElement('figure');const link=document.createElement('a');link.href=item.src;link.target='_blank';link.rel='noopener';const img=document.createElement('img');img.src=item.src;img.alt=item.title||'작품 에셋';img.loading='lazy';link.append(img);const caption=document.createElement('figcaption');caption.textContent=item.title||'';figure.append(link,caption);gallery.append(figure)}document.querySelector('#empty').hidden=gallery.children.length>0;</script></body></html>
